<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E" />
      <stop offset="50%" stop-color="#0D101A" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>

    <!-- Ambient Glow 1 (Cyan/Teal) -->
    <radialGradient id="glowCyan" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Glow 2 (Violet/Indigo) -->
    <radialGradient id="glowViolet" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181C28" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0E121B" stop-opacity="0.85" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Cairo:wght@600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 64px; letter-spacing: -0.03em; }
    .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 26px; fill: url(#textGrad); letter-spacing: -0.01em; }
    .arabic { font-family: 'Cairo', sans-serif; font-weight: 700; fill: #94A3B8; font-size: 32px; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 15px; fill: #38BDF8; font-weight: 600; }
    .desc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; fill: #94A3B8; font-weight: 400; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Glow circles -->
  <rect width="1200" height="630" fill="url(#glowCyan)" />
  <rect width="1200" height="630" fill="url(#glowViolet)" />

  <!-- Decorative Matrix / Code lines on Right side -->
  <g opacity="0.15">
    <text x="740" y="90" font-family="'JetBrains Mono', monospace" font-size="13" fill="#38BDF8">&lt;Component&gt;</text>
    <text x="760" y="120" font-family="'JetBrains Mono', monospace" font-size="13" fill="#818CF8">readonly state$ = inject(Store).pipe(</text>
    <text x="780" y="150" font-family="'JetBrains Mono', monospace" font-size="13" fill="#A78BFA">  distinctUntilChanged(),</text>
    <text x="780" y="180" font-family="'JetBrains Mono', monospace" font-size="13" fill="#A78BFA">  shareReplay({ refCount: true })</text>
    <text x="760" y="210" font-family="'JetBrains Mono', monospace" font-size="13" fill="#818CF8">);</text>
    <text x="740" y="240" font-family="'JetBrains Mono', monospace" font-size="13" fill="#38BDF8">&lt;/Component&gt;</text>

    <text x="740" y="320" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34D399">✓ 100% Type-Safe Clean Architecture</text>
    <text x="740" y="350" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34D399">✓ Reactive State Management (RxJS)</text>
    <text x="740" y="380" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34D399">✓ Micro-Frontends &amp; High-Perf Apps</text>
    <text x="740" y="410" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34D399">✓ Zero Dependencies Bloat</text>
  </g>

  <!-- Main Card Container -->
  <rect x="70" y="65" width="1060" height="500" rx="24" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Decorative Card Glow border accent top-left -->
  <path d="M 70 120 L 70 89 A 24 24 0 0 1 94 65 L 240 65" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

  <!-- Status Chip Top Left -->
  <g transform="translate(120, 115)">
    <rect width="250" height="36" rx="18" fill="#0E1726" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">AVAILABLE FOR HIRE</text>
  </g>

  <!-- URL Tag Top Right -->
  <g transform="translate(860, 115)">
    <text x="0" y="23" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#64748B">bassemhussein.github.io</text>
  </g>

  <!-- Brand Signature / Monogram -->
  <g transform="translate(120, 185)">
    <rect width="56" height="56" rx="14" fill="#0A0F1D" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="14" y="36" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#38BDF8">&lt;B/&gt;</text>
  </g>

  <!-- Name -->
  <text x="195" y="226" class="title">Bassem Hussein</text>
  <text x="735" y="226" class="arabic">باسم حسين</text>

  <!-- Role Title -->
  <text x="120" y="285" class="subtitle">Senior Frontend Software Engineer</text>

  <!-- Brief Description -->
  <text x="120" y="325" class="desc">Architecting robust enterprise web applications, high-performance user interfaces,</text>
  <text x="120" y="352" class="desc">reactive state systems, and clean architectural paradigms.</text>

  <!-- Horizontal divider -->
  <line x1="120" y1="385" x2="1020" y2="385" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Core Skills Badges -->
  <!-- Badge 1: Angular -->
  <g transform="translate(120, 420)">
    <rect width="130" height="42" rx="10" fill="#DD0031" fill-opacity="0.12" stroke="#DD0031" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="21" r="4" fill="#DD0031" />
    <text x="40" y="26" class="badge-text" fill="#FDA4AF">Angular 19</text>
  </g>

  <!-- Badge 2: TypeScript -->
  <g transform="translate(265, 420)">
    <rect width="145" height="42" rx="10" fill="#3178C6" fill-opacity="0.12" stroke="#3178C6" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="21" r="4" fill="#3178C6" />
    <text x="40" y="26" class="badge-text" fill="#93C5FD">TypeScript</text>
  </g>

  <!-- Badge 3: RxJS -->
  <g transform="translate(425, 420)">
    <rect width="115" height="42" rx="10" fill="#B7178C" fill-opacity="0.12" stroke="#B7178C" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="21" r="4" fill="#B7178C" />
    <text x="40" y="26" class="badge-text" fill="#F472B6">RxJS</text>
  </g>

  <!-- Badge 4: Clean Architecture -->
  <g transform="translate(555, 420)">
    <rect width="200" height="42" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="21" r="4" fill="#10B981" />
    <text x="40" y="26" class="badge-text" fill="#6EE7B7">Clean Architecture</text>
  </g>

  <!-- Badge 5: Micro-Frontends -->
  <g transform="translate(770, 420)">
    <rect width="180" height="42" rx="10" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="21" r="4" fill="#8B5CF6" />
    <text x="40" y="26" class="badge-text" fill="#C4B5FD">Micro-Frontends</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(120, 515)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">📍 Cairo, Egypt  •  💼 Ex-EgBank Intern  •  🚀 GDSC Lead  •  🌐 Open to Global Remote</text>
  </g>
</svg>
