    <script>
      // Fix GitHub Pages subpath resolution when URL lacks trailing slash
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

    <div id="root"></div>
    <script>
      // Fallback loader for GitHub Pages when served as raw unbundled repository
      if (window.location.hostname.endsWith('github.io')) {
        setTimeout(function() {
          if (!window.__APP_MOUNTED__) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = './docs/assets/index.js';
            script.onerror = function() {
              var rootScript = document.createElement('script');
              rootScript.type = 'module';
              rootScript.src = './assets/index.js';
              document.body.appendChild(rootScript);
            };
            document.body.appendChild(script);

            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = './docs/assets/index.css';
            link.onerror = function() {
              var rootLink = document.createElement('link');
              rootLink.rel = 'stylesheet';
              rootLink.href = './assets/index.css';
              document.head.appendChild(rootLink);
            };
            document.head.appendChild(link);
          }
        }, 50);
      }
    </script>
  </body>
